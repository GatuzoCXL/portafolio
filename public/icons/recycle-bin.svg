<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- Recycle bin body -->
  <rect x="2" y="5" width="12" height="10" rx="1" fill="#c0c0c0" stroke="#808080" stroke-width="0.5"/>
  <!-- Bin lid -->
  <rect x="1" y="3" width="14" height="2" rx="0.5" fill="#d0d0d0" stroke="#808080" stroke-width="0.5"/>
  <!-- Handle -->
  <rect x="6" y="1" width="4" height="2" rx="0.5" fill="#a0a0a0" stroke="#808080" stroke-width="0.5"/>
  <!-- Vertical lines -->
  <line x1="5" y1="6" x2="5" y2="14" stroke="#909090" stroke-width="0.7"/>
  <line x1="8" y1="6" x2="8" y2="14" stroke="#909090" stroke-width="0.7"/>
  <line x1="11" y1="6" x2="11" y2="14" stroke="#909090" stroke-width="0.7"/>
  <!-- Highlight -->
  <rect x="3" y="6" width="2" height="8" fill="white" fill-opacity="0.3"/>
</svg>