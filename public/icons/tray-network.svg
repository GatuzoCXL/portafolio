<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- Monitor/screen -->
  <rect x="1" y="2" width="10" height="8" rx="1" fill="#b8b8b8" stroke="#606060" stroke-width="0.5"/>
  <!-- Screen content (signal waves) -->
  <path d="M3,5 L5,6 L3,7" stroke="#808080" stroke-width="0.7" fill="none"/>
  <path d="M5,4 L7,6 L5,8" stroke="#808080" stroke-width="0.7" fill="none"/>
  <!-- Stand -->
  <rect x="5" y="10" width="2" height="2" fill="#a0a0a0" stroke="#606060" stroke-width="0.5"/>
  <rect x="3" y="12" width="6" height="1" rx="0.5" fill="#909090" stroke="#606060" stroke-width="0.5"/>
  <!-- Connection dots -->
  <circle cx="13" cy="4" r="1" fill="#909090"/>
  <circle cx="13" cy="8" r="1" fill="#909090"/>
  <circle cx="13" cy="12" r="1" fill="#909090"/>
</svg>